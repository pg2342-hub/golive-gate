name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  example-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Reference agent must pass the gate
        run: golive run examples/refund_agent/golive.yml --out reports/spec
      - name: Naive agent must be blocked by the gate
        run: |
          set +e
          golive run examples/refund_agent/golive.yml --agent agent:naive_agent --out reports/naive
          code=$?
          if [ "$code" -ne 1 ]; then echo "expected no-go (exit 1), got $code"; exit 1; fi
      - name: Gate summary
        if: always()
        run: cat reports/spec/report.md >> "$GITHUB_STEP_SUMMARY"
