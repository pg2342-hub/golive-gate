name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    # ubuntu-24.04: the newest runner image no longer ships Python 3.9
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  example-gate:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[claude]"
      - name: Reference agent must pass the gate
        run: golive run examples/refund_agent/golive.yml --out reports/spec
      - name: Naive agent must be blocked by the gate
        run: |
          set +e
          golive run examples/refund_agent/golive.yml --agent agent:naive_agent --out reports/naive
          code=$?
          if [ "$code" -ne 1 ]; then echo "expected no-go (exit 1), got $code"; exit 1; fi
          python scripts/expect.py reports/naive/results.json no-go
      - name: Field-service booking example
        run: |
          golive run examples/field_service_booking/golive.yml --runs 1 --out reports/booking
          set +e; golive run examples/field_service_booking/golive.yml --agent agent:naive_agent --runs 1 --out reports/booking-naive
          test $? -eq 1 || exit 1
          set -e; python scripts/expect.py reports/booking-naive/results.json no-go
      - name: Voice screening example (prompt fix takes it from no-go to go)
        run: |
          golive run examples/voice_screening/golive.yml --agent agent:candidate_v2 --out reports/voice-v2
          set +e; golive run examples/voice_screening/golive.yml --agent agent:candidate_v1 --out reports/voice-v1
          test $? -eq 1 || exit 1
          set -e; python scripts/expect.py reports/voice-v1/results.json no-go
          golive diff reports/voice-v1/results.json reports/voice-v2/results.json
      - name: Ablation against the naive agent
        run: golive ablate examples/refund_agent/golive.yml --agent agent:naive_agent --runs 1 --out reports/ablation
      - name: LLM judge example (runs only when the ANTHROPIC_API_KEY secret is set)
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          golive run examples/refund_agent/golive.judge.yml --out reports/judge
          python scripts/expect.py reports/judge/results.json go --show decline_tone
          # Negative control: right decisions, rude declines. Only the judge can catch this.
          set +e; golive run examples/refund_agent/golive.judge.yml --agent agent:rude_agent --out reports/judge-rude
          test $? -eq 1 || exit 1
          set -e; python scripts/expect.py reports/judge-rude/results.json no-go --show decline_tone --fails decline_tone
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
      - name: Gate summary
        if: always()
        run: |
          cat reports/spec/report.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/judge/report.md ]; then cat reports/judge/report.md >> "$GITHUB_STEP_SUMMARY"; fi
